# Build artefacts on Windows live outside OneDrive: target/ churns on every
# build and syncing it costs CPU that lands directly in the latency numbers this
# project is measured on. Cargo cannot scope [build] target-dir to one
# platform, so on Windows set CARGO_TARGET_DIR in the PowerShell profile:
#   $env:CARGO_TARGET_DIR = "$env:LOCALAPPDATA\Flow\target"
# On Linux the default target/ next to the sources is right.
