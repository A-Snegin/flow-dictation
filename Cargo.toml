[package]
name = "flow"
version = "0.1.0"
edition = "2021"
description = "Speed-first local dictation for Windows"
publish = false

[lib]
name = "flow"
path = "src/lib.rs"

[[bin]]
name = "flow-core"
path = "src/main.rs"

[[bin]]
name = "smoke"
path = "src/bin/smoke.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[[bin]]
name = "bench-e2e"
path = "src/bin/bench_e2e.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.9"

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Media_Audio",
  "Win32_Media_KernelStreaming",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_LibraryLoader",
  "Win32_System_Performance",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_Graphics_Gdi",
]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
