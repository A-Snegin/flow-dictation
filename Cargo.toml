[package]
name = "flow"
version = "0.1.0"
edition = "2021"
description = "Speed-first local dictation for Windows and Linux"
publish = false

[lib]
name = "flow"
path = "src/lib.rs"

[[bin]]
name = "flow-core"
path = "src/main.rs"

[[bin]]
name = "smoke"
path = "src/bin/smoke.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[[bin]]
name = "bench-e2e"
path = "src/bin/bench_e2e.rs"

[[bin]]
name = "insert-test"
path = "src/bin/insert_test.rs"

[[bin]]
name = "wer"
path = "src/bin/wer.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.9"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Registry",
  "Win32_Media_Audio",
  "Win32_Media_KernelStreaming",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_LibraryLoader",
  "Win32_System_Performance",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Controls",
  "Win32_Globalization",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_Graphics_Gdi",
]

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
pipewire = "0.10"
smithay-client-toolkit = "0.21"
tiny-skia = "0.12"
ab_glyph = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
